name: CI

on:
  push:
    branches: [master, "release/**"]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly dependency/audit check

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  release-gates:
    name: release gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Whitespace check
        run: git diff --check
      - name: Production dependency audit
        run: npm audit --omit=dev
      - name: Pack, install, and MCP smoke test
        run: npm run pack:verify
      - name: Fail if dist is stale
        run: |
          npm run clean && npm run build
          git status --porcelain dist | grep -q . && { echo "dist/ changed after a clean build"; exit 1; } || true
